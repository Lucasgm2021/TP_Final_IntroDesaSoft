<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>
        Puerto Hermoso
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >
</head>

<body
    style="
        margin: 0;

        min-height: 100vh;

        background-image:
            url('{{ url_for('static', filename='img/background.jpg') }}');

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        overflow: hidden;

        position: sticky;
    "
>

    <div
        style="
            position: absolute;

            inset: 0;

            background: rgba(43, 49, 58, 0.5);

            z-index: 1;
        "
    ></div>

    <main
        style="
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100vh;
        "
    >

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
