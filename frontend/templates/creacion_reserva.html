<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear reserva</title>
</head>
<body>
    <h1>Hola mundo!</h1>
    <!-- Flask flash sintaxis-->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
            <div class="flash flash--{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}
    <form action="{{ url_for('reservas.crear_reserva_form')}}" method="post">
        <div style="display: flex;flex-direction: column; width: 250px;user-select: none;"> 
            <label for="hora_reserva"></label><input type="time" name="hora_reserva" required>
            <label for="dia_reserva"></label><input type="date" name="dia_reserva" required>
            <label for="comensales"></label><input type="number" name="comensales" min="0" required>
        </div>
        <label for="interior">Interior</label>
        <input type="radio" id="interior" name="interior" value="true" required>            
        <label for="exterior">Exterior</label>
        <input type="radio" id="exterior" name="interior" value="false" required>

        <div style="display: flex;flex-direction: column; width: 180px;user-select: none;"> 
            <label for="mesas_disponibles">Elija una mesa disponible</label>
            <select name="mesas_disponibles" id="mesas_disponibles" required>
                <option value="" selected disabled hidden>Elije una mesa</option>
                <option value="Mesa 101">Mesa 101</option>
                <option value="Mesa 102">Mesa 102</option>
            </select>
            <input type="submit" value="submit form">
        </div>
    </form>
</body>
</html>
