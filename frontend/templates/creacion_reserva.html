<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear reserva</title>
</head>
<body>
    <h1>Hola mundo!</h1>
    <form action="{{ url_for('reservas.crear_reserva_form')}}" method="post">
        <div style="display: flex;flex-direction: column; width: 250px;user-select: none;"> 
            <label for="hora_reserva"></label><input type="time" name="hora_reserva">
            <label for="dia_reserva"></label><input type="date" name="dia_reserva">
            <label for="comensales"></label><input type="number" name="comensales" min="0">
        </div>
        <label for="interior">Interior</label>
        <input type="radio" id="interior" name="interior" value="true">            
        <label for="exterior">Exterior</label>
        <input type="radio" id="exterior" name="interior" value="false">

        <div style="display: flex;flex-direction: column; width: 180px;user-select: none;"> 
            <label for="mesas_disponibles">Elija una mesa disponible</label>
            <select name="mesas_disponibles" id="mesas_disponibles">
                <option value="Mesa 101">Mesa 101</option>
                <option value="Mesa 102">Mesa 102</option>
            </select>
            <input type="submit" value="submit form">
        </div>
    </form>
</body>
</html>
