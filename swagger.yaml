  # ==========================================================================
  # RESERVAS
  # ==========================================================================
  /reservas/:
    get:
      tags: [Reservas]
      summary: Listar reservas
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
          example: "2026-05-26"
        - name: hora
          in: query
          schema:
            type: string
          example: "20:00:00"
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, cancelada, finalizada]
        - name: id_usuario
          in: query
          schema:
            type: integer
        - name: mesas
          in: query
          description: Si es `true` (por defecto) incluye las mesas asociadas a cada reserva.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reserva"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No autenticado"
                    level: "error"

    post:
      tags: [Reservas]
      summary: Crear una reserva
      description: |
        El cliente envía en `ids_mesas` las mesas elegidas; el backend valida que su capacidad total cubra la cantidad de comensales.
        Al crearse, envía un email al usuario con un QR para confirmar la llegada y un enlace de cancelación.
        El QR vence a los 30 minutos de la hora de reserva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaInput"
      responses:
        "201":
          description: Reserva creada. Email enviado con QR.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  id:
                    type: integer
        "400":
          description: La capacidad de las mesas seleccionadas no es compatible con la cantidad de comensales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "La capacidad de las mesas seleccionadas no es compatible con la cantidad de comensales"
                    level: "error"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No autenticado"
                    level: "error"
        "403":
          description: No tiene permisos para reservar en nombre de otro usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 403
                    message: "No tiene permisos para reservar en nombre de otro usuario"
                    level: "error"

  /reservas/mesas/disponibles:
    get:
      tags: [Reservas]
      summary: Cantidad de mesas disponibles en este momento
      responses:
        "200":
          description: Mesas disponibles en el turno actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  mesas_disponibles:
                    type: integer
                    example: 3

  /reservas/mesas/validacion:
    get:
      tags: [Reservas]
      summary: Capacidades posibles para una fecha/hora/ubicación
      description: Devuelve un rango [1..N] donde N es la mayor mesa disponible, para validar el formulario de reserva en el frontend.
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-05-26"
        - name: hora
          in: query
          required: true
          schema:
            type: string
          example: "20:00:00"
        - name: interior
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: Listado de capacidades o mensaje de sin disponibilidad
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      Listado de capacidades disponibles:
                        type: array
                        items:
                          type: integer
                        example: [1, 2, 3, 4]
                  - type: object
                    properties:
                      Msg:
                        type: string
                        example: "No hay mesas disponibles en esa fecha y hora."

  /reservas/confirmar/{uuid_reserva}:
    post:
      tags: [Reservas]
      summary: Confirmar llegada escaneando QR
      description: Valida que el QR esté pendiente y no expirado, y marca la reserva como `finalizada`.
      parameters:
        - name: uuid_reserva
          in: path
          required: true
          schema:
            type: string
          example: "a1b2c3d4e5f6..."
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
        "400":
          description: QR ya usado, expirado, o reserva no confirmable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "QR ya usado, expirado, o reserva no confirmable"
                    level: "error"

  /reservas/cancelar/{uuid_reserva}:
    post:
      tags: [Reservas]
      summary: Cancelar una reserva desde el enlace del email
      parameters:
        - name: uuid_reserva
          in: path
          required: true
          schema:
            type: string
          example: "a1b2c3d4e5f6..."
      responses:
        "201":
          description: Reserva cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
        "400":
          description: La reserva no estaba pendiente
          content:
            application/json:
              schema:
                type: object
                properties:
                  Error:
                    type: string
        "404":
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Reserva no encontrada"
                    level: "error"

  /reservas/{id_reserva}:
    get:
      tags: [Reservas]
      summary: "[Admin] Obtener una reserva por ID"
      parameters:
        - name: id_reserva
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Datos de la reserva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Reserva"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No autenticado"
                    level: "error"
        "403":
          description: No es administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 403
                    message: "No es administrador"
                    level: "error"
        "404":
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Reserva no encontrada"
                    level: "error"
    patch:
      tags: [Reservas]
      summary: Modificar campos de una reserva
      description: Los admins pueden editar todos los campos. Los usuarios comunes solo pueden cambiar `estado_reserva` (para cancelar).
      parameters:
        - name: id_reserva
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Admin: {id_mesa, estado_reserva, hora_reserva, fecha, interior, estado_qr, qr_expiracion, comensales}. Usuario: {estado_reserva}"
              additionalProperties: true
      responses:
        "201":
          description: Reserva modificada
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Reserva no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Reserva no encontrada"
                    level: "error"

  # ==========================================================================
  # RESENAS
  # ==========================================================================
  /rese%C3%B1as/:
    get:
      tags: [Resenas]
