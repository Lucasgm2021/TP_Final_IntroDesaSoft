  # ==========================================================================
  # INFO FRONTEND
  # ==========================================================================
  /info_frontend/:
    get:
      tags: [Info Frontend]
      summary: Obtener toda la configuración del restaurante (público)
      description: Devuelve un objeto plano con todas las claves de configuración (nombre, teléfono, horario, historia, etc.).
      responses:
        "200":
          description: Configuración completa
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              example:
                nombre_restaurante: "PUERTO HERMOSO"
                telefono: "+54 11 1234-5678"
                horario: "Lunes a Domingo 12:00 - 00:00"

    post:
      tags: [Info Frontend]
      summary: Crear una entrada de configuración
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigEntry"
      responses:
        "201":
          description: Configuración creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
        "400":
          description: Falta clave o valor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Falta clave o valor"
                    level: "error"
        "409":
          description: La clave ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 409
                    message: "La clave ya existe"
                    level: "error"

  /info_frontend/{clave}:
    get:
      tags: [Info Frontend]
      summary: Obtener un valor de configuración por clave (público)
      parameters:
        - name: clave
          in: path
          required: true
          schema:
            type: string
          example: "nombre_restaurante"
      responses:
        "200":
          description: Valor de la clave
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              example:
                nombre_restaurante: "PUERTO HERMOSO"
        "404":
          description: Configuración no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Configuración no encontrada"
                    level: "error"

    patch:
      tags: [Info Frontend]
      summary: Actualizar el valor de una clave
      parameters:
        - name: clave
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor:
                  type: string
                  example: "PUERTO HERMOSO RENOVADO"
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Falta valor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Falta valor"
                    level: "error"
        "404":
          description: Configuración no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Configuración no encontrada"
                    level: "error"

    delete:
      tags: [Info Frontend]
      summary: Eliminar una clave de configuración
      parameters:
        - name: clave
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuración eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Configuración no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Configuración no encontrada"
                    level: "error"
