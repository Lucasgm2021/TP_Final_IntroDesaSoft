openapi: 3.0.3
info:
  title: Puerto Hermoso API
  description: |
    API REST para el sistema de gestión del restaurante **Puerto Hermoso**.

    ## Autenticación
    La API usa sesiones basadas en cookies (`session`). Para los endpoints protegidos
    hay que iniciar sesión primero mediante `POST /sesion/login`.
    Los endpoints marcados con [Auth] requieren sesión activa de usuario.
    Los marcados con [Admin] requieren que el usuario sea administrador.
  version: 1.0.0

servers:
  - url: http://localhost:5005
    description: Servidor local de desarrollo

tags:
  - name: Sesión
    description: Login, registro y logout
  - name: Usuarios
    description: ABM de usuarios (clientes y admins)
  - name: Mesas
    description: ABM de mesas del restaurante
  - name: Menú
    description: ABM de platos del menú
  - name: Reservas
    description: Ciclo de vida completo de reservas y flujo QR
  - name: Resenas
    description: Creacion y moderacion de resenas
  - name: Info Frontend
    description: Configuración general del restaurante (nombre, teléfono, etc.)

# ---------------------------------------------------------------------------
# Componentes reutilizables
# ---------------------------------------------------------------------------
components:
  schemas:

    ErrorItem:
      type: object
      properties:
        code:
          type: integer
          description: Código HTTP del error (coincide con el status de la respuesta)
        message:
          type: string
          example: "Descripción breve del error"
        level:
          type: string
          example: "error"
        description:
          type: string
          example: "Detalle adicional del error"

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorItem"

    Mesa:
      type: object
      properties:
        id_mesa:
          type: integer
          example: 1
        numero:
          type: integer
          example: 5
        capacidad:
          type: integer
          example: 4
        interior:
          type: boolean
          example: true
        funcional:
          type: boolean
          example: true

    MesaInput:
      type: object
      required:
        - numero
        - capacidad
        - interior
      properties:
        numero:
          type: integer
          example: 5
        capacidad:
          type: integer
          example: 4
        interior:
          type: boolean
          example: true
        funcional:
          type: boolean
          default: true

    MesaPatchInput:
      type: object
      properties:
        numero:
          type: integer
          example: 5
        capacidad:
          type: integer
          example: 4
        interior:
          type: boolean
        funcional:
          type: boolean

    Plato:
      type: object
      properties:
        id_plato:
          type: integer
          example: 1
        id_categoria:
          type: integer
          example: 2
        nombre:
          type: string
          example: "Milanesa napolitana"
        link_imagen:
          type: string
          example: "https://example.com/img/milanesa.jpg"
        precio:
          type: number
          format: float
          example: 3500.00
        hay_stock:
          type: boolean
          example: true
        gluten:
          type: boolean
          example: true
        producto_animal:
          type: boolean
          example: true
        carnes:
          type: boolean
          example: true
        lactosa:
          type: boolean
          example: false

    PlatoInput:
      type: object
      required:
        - nombre
        - precio
      properties:
        nombre:
          type: string
          example: "Milanesa napolitana"
        id_categoria:
          type: integer
          example: 2
        link_imagen:
          type: string
          example: "https://example.com/img/milanesa.jpg"
        precio:
          type: number
          format: float
          example: 3500.00
        hay_stock:
          type: boolean
          default: true
        gluten:
          type: boolean
          default: false
        producto_animal:
          type: boolean
          default: false
        carnes:
          type: boolean
          default: false
        lactosa:
          type: boolean
          default: false

    Reserva:
      type: object
      properties:
        id_reserva:
          type: integer
          example: 1
        id_usuario:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
          example: "2026-05-26T15:00:00Z"
        estado_reserva:
          type: string
          enum: [pendiente, cancelada, finalizada]
          example: "pendiente"
        reseñada:
          type: boolean
          example: false
        hora_reserva:
          type: string
          example: "20:00:00"
        fecha:
          type: string
          format: date
          example: "2026-05-26"
        interior:
          type: boolean
          example: true
        uuid_qr:
          type: string
          example: "a1b2c3d4e5f6..."
        estado_qr:
          type: string
          enum: [pendiente, usado, expirado]
          example: "pendiente"
        qr_expiracion:
          type: string
          format: date-time
          example: "2026-05-26T20:30:00Z"
        comensales:
          type: integer
          example: 2
        id_mesa:
          type: integer
          example: 4

    ReservaInput:
      type: object
      required:
        - interior
        - fecha
        - hora
        - nro_comensales
        - ids_mesas
      properties:
        interior:
          type: boolean
          example: true
        fecha:
          type: string
          format: date
          example: "2026-05-26"
        hora:
          type: string
          example: "20:00:00"
          description: "Debe ser una hora en punto (e.g. 20:00:00)"
        nro_comensales:
          type: integer
          example: 2
        ids_mesas:
          type: array
          items:
            type: string
          description: "IDs de las mesas elegidas por el cliente (como strings). El backend valida que la capacidad total cubra a los comensales."
          example: ["3", "4"]
        id_usuario:
          type: integer
          description: "Si no se envía se usa el id del usuario en sesión. Solo admins pueden reservar en nombre de otro usuario."

    Resena:
      type: object
      properties:
        id_reseña:
          type: integer
          example: 1
        id_usuario:
          type: integer
          example: 3
        id_reserva:
          type: integer
          example: 7
        fecha:
          type: string
          format: date-time
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        comentario:
          type: string
          example: "Excelente comida y atencion"
        estado:
          type: string
          enum: [no_revisada, no_aprobada, aprobada]
          example: "no_revisada"
        email:
          type: string
          format: email
          example: "cliente@gmail.com"

    ResenaInput:
      type: object
      required:
        - id_reserva
        - calificacion
      properties:
        id_reserva:
          type: integer
          example: 7
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        comentario:
          type: string
          example: "Excelente comida y atención"

    ConfigEntry:
      type: object
      properties:
        clave:
          type: string
          example: "nombre_restaurante"
        valor:
          type: string
          example: "PUERTO HERMOSO"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # SESIÓN
  # ==========================================================================
  /sesion/login:
    post:
      tags: [Sesión]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@puertohermoso.com"
                password:
                  type: string
                  example: "1234"
      responses:
        "200":
          description: Sesión iniciada. La cookie de sesión se devuelve automáticamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 200
                    message: "Logueado con exito"
                    level: "confirmacion"
                    description: ""
        "400":
          description: Falta email o contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Falta email o contraseña"
                    level: "error"
        "401":
          description: Contraseña incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "Contraseña incorrecta"
                    level: "error"
        "404":
          description: El usuario no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "El usuario no existe"
                    level: "error"

  /sesion/register:
    post:
      tags: [Sesión]
      summary: Registrarse como usuario cliente (inicia sesión automáticamente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "pedro@fi.uba.ar"
                password:
                  type: string
                  example: "caracol"
      responses:
        "201":
          description: Registrado y sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 201
                    message: "Registrado y sesión iniciada."
                    level: "error"
        "400":
          description: Falta email o contraseña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Falta email o contraseña"
                    level: "error"
        "409":
          description: El usuario ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 409
                    message: "El usuario ya existe"
                    level: "error"

  /sesion/logout:
    post:
      tags: [Sesión]
      summary: Cerrar sesión
      responses:
        "201":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 201
                    message: "Sesión cerrada."
                    level: "error"
        "400":
          description: No estás logueado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "No estás logueado"
                    level: "error"
    get:
      tags: [Sesión]
      summary: Cerrar sesión (también disponible por GET)
      responses:
        "201":
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 201
                    message: "Sesión cerrada."
                    level: "error"
        "400":
          description: No estás logueado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "No estás logueado"
                    level: "error"

  /sesion/perfil:
    get:
      tags: [Sesión]
      summary: Ver perfil del usuario en sesión (endpoint temporal)
      responses:
        "200":
          description: Datos del usuario en sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_usuario:
                    type: integer
                  email:
                    type: string
                  es_admin:
                    type: boolean
        "401":
          description: No iniciaste sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ==========================================================================
  # USUARIOS
  # ==========================================================================
  /usuarios/registro:
    post:
      tags: [Usuarios]
      summary: Registrar un nuevo cliente (público)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, contraseña]
              properties:
                email:
                  type: string
                  format: email
                  example: "cliente@gmail.com"
                contraseña:
                  type: string
                  example: "secreto123"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
        "400":
          description: Campo faltante o email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Campo faltante o email inválido"
                    level: "error"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 409
                    message: "El email ya está registrado"
                    level: "error"

  /usuarios/:
    get:
      tags: [Usuarios]
      summary: Obtener todos los usuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_usuario:
                          type: integer
                        email:
                          type: string
                        es_admin:
                          type: integer
                          description: "1 = administrador, 0 = cliente"
                          example: 0
              example:
                data:
                  - id_usuario: 1
                    email: "admin@puertohermoso.com"
                    es_admin: 1
                  - id_usuario: 2
                    email: "juan.perez@email.com"
                    es_admin: 0
        "404":
          description: No hay usuarios registrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "No hay usuarios registrados"
                    level: "error"

    post:
      tags: [Usuarios]
      summary: Crear un usuario con rol explícito (admin o cliente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, contraseña, es_admin]
              properties:
                email:
                  type: string
                  format: email
                contraseña:
                  type: string
                es_admin:
                  type: boolean
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      es_admin:
                        type: boolean
        "400":
          description: Campo faltante o email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Campo faltante o email inválido"
                    level: "error"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 409
                    message: "El email ya está registrado"
                    level: "error"

    put:
      tags: [Usuarios]
      summary: Actualizar rol (es_admin) de un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, es_admin]
              properties:
                email:
                  type: string
                  format: email
                es_admin:
                  type: boolean
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      es_admin:
                        type: boolean
        "400":
          description: Campo faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Campo faltante"
                    level: "error"

  /usuarios/{email}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario por email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
          example: "admin@puertohermoso.com"
      responses:
        "200":
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_usuario:
                    type: integer
                  email:
                    type: string
                  es_admin:
                    type: boolean
                  reservas:
                    type: integer
                  canceladas:
                    type: integer
        "400":
          description: Email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Email inválido"
                    level: "error"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Usuario no encontrado"
                    level: "error"

    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario por email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
          example: "cliente@gmail.com"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      email:
                        type: string
        "400":
          description: Email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Email inválido"
                    level: "error"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Usuario no encontrado"
                    level: "error"

  /usuarios/cliente/mi_perfil:
    get:
      tags: [Usuarios]
      summary: Obtener el perfil propio
      responses:
        "200":
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_usuario:
                    type: integer
                  email:
                    type: string
                  es_admin:
                    type: boolean
                  reservas:
                    type: integer
                  canceladas:
                    type: integer
        "401":
          description: No hay sesión activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No hay sesión activa"
                    level: "error"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Usuario no encontrado"
                    level: "error"

    patch:
      tags: [Usuarios]
      summary: Actualizar email y contraseña propios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevo_email, nueva_contraseña]
              properties:
                nuevo_email:
                  type: string
                  format: email
                  example: "nuevo@gmail.com"
                nueva_contraseña:
                  type: string
                  example: "nuevapass"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      nuevo_email:
                        type: string
        "400":
          description: Campo faltante o email inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Campo faltante o email inválido"
                    level: "error"
        "409":
          description: Ya hay un usuario registrado con ese email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 409
                    message: "Ya hay un usuario registrado con ese email"
                    level: "error"

    delete:
      tags: [Usuarios]
      summary: Eliminar el perfil propio
      description: Borra el usuario autenticado y cierra su sesión.
      responses:
        "200":
          description: Perfil eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: No hay sesión activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No hay sesión activa"
                    level: "error"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 404
                    message: "Usuario no encontrado"
                    level: "error"

  # ==========================================================================
  # MESAS
  # ==========================================================================
  /mesas/:
    get:
      tags: [Mesas]
      summary: Obtener todas las mesas
      responses:
        "200":
          description: Lista de mesas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mesa"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No autenticado"
                    level: "error"

    post:
      tags: [Mesas]
      summary: Crear una mesa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesaInput"
      responses:
        "201":
          description: Mesa creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id_mesa:
                    type: integer
        "400":
          description: Campo faltante, valor inválido, o número de mesa duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 400
                    message: "Campo faltante, valor inválido, o número de mesa duplicado"
                    level: "error"
        "401":
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 401
                    message: "No autenticado"
                    level: "error"
        "403":
          description: No es administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - code: 403
                    message: "No es administrador"
                    level: "error"

  /mesas/validacion:
    get:
      tags: [Mesas]
      summary: Mesas disponibles para una fecha/hora/ubicación
      description: Devuelve las mesas funcionales no ocupadas en la fecha/hora indicada según la ubicación (interior/exterior).
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-05-26"
        - name: hora
          in: query
          required: true
          schema:
            type: string
          example: "20:00:00"
